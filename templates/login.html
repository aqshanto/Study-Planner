{% extends "base.html" %} {% block title %}Log in - Study Planner{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Log in</h1>

        <!-- Posts back to /login, which is handled by login() in app.py. -->
        <form method="POST">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input
              class="form-control"
              id="email"
              name="email"
              type="email"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input
              class="form-control"
              id="password"
              name="password"
              type="password"
              required
            />
          </div>
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>

        <p class="mt-3 mb-0 text-center">
          No account yet? <a href="{{ url_for('signup') }}">Sign up</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
